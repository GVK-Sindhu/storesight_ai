
version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: storesight_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - db_data:/store-intelligence/data
    healthcheck:
      # Bulletproof python healthcheck that doesn't require curl or wget
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: storesight_dashboard
    command: streamlit run dashboard/dashboard.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
    volumes:
      - db_data:/store-intelligence/data
    depends_on:
      api:
        condition: service_healthy

volumes:
  db_data:
